name: Verify npm ci (Linux)

on:
  push:
    branches: [deploy, master]
  workflow_dispatch:

jobs:
  npm-ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma generate
